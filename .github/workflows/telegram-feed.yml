name: Telegram feed

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled jobs by several minutes.
    - cron: "10,40 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: telegram-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Fetch public Telegram preview
        run: python scripts/fetch_telegram.py

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes"
          else
            git commit -m "Update Telegram feed from @NomberObsidian"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # This repo uses legacy branch-based GitHub Pages. Commits made with
      # GITHUB_TOKEN do not trigger a Pages build, so we request one explicitly.
      - name: Request Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
